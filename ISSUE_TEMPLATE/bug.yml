name: Bug Report
description: Report unexpected behavior or a defect
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is the bug?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to trigger the bug
      placeholder: |
        1. Install `@centralping/ergo@0.1.0-beta.1`
        2. Call `compose(...)` with ...
        3. Observe error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happens instead? Include error messages, stack traces, or screenshots.
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (blocks usage or data loss)
        - High (major feature broken, workaround exists)
        - Medium (minor feature broken or degraded)
        - Low (cosmetic or edge case)
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node.js version, package version, OS — anything relevant
      placeholder: "Node.js 22.14.0, @centralping/ergo 0.1.0-beta.1, macOS 15.4"

  - type: checkboxes
    id: repos
    attributes:
      label: Affected Package
      options:
        - label: "@centralping/ergo"
        - label: "@centralping/ergo-router"
        - label: "@centralping/json-api-query"
        - label: "Website (centralping.github.io)"
